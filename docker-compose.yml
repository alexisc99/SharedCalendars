version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: myapp_postgres
    restart: always
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: myapp
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: myapp_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
